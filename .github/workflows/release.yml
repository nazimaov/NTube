# Релиз по тегу v*: подписанный APK прикладывается к релизу GitHub (SPEC 10.4).
# Секреты: LUMEN_KEYSTORE_BASE64, LUMEN_KEYSTORE_PASSWORD, LUMEN_KEY_ALIAS, LUMEN_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          LUMEN_KEYSTORE_BASE64: ${{ secrets.LUMEN_KEYSTORE_BASE64 }}
        run: |
          echo "$LUMEN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lumen-release.jks"
          echo "LUMEN_KEYSTORE=$RUNNER_TEMP/lumen-release.jks" >> "$GITHUB_ENV"

      - name: Assemble release
        env:
          LUMEN_KEYSTORE_PASSWORD: ${{ secrets.LUMEN_KEYSTORE_PASSWORD }}
          LUMEN_KEY_ALIAS: ${{ secrets.LUMEN_KEY_ALIAS }}
          LUMEN_KEY_PASSWORD: ${{ secrets.LUMEN_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Rename APK
        run: |
          VERSION=$(grep '^lumen.versionName=' gradle.properties | cut -d= -f2)
          cp app/build/outputs/apk/release/app-release.apk "lumen-$VERSION.apk"
          echo "APK=lumen-$VERSION.apk" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^lumen.versionName=' gradle.properties | cut -d= -f2)
          # Что нового показывается в самом приложении (окно обновления): docs/releases/<версия>.md с разделами ## ru и ## en;
          # нет файла — берётся текст коммита с тегом
          if [ -f "docs/releases/$VERSION.md" ]; then
            cp "docs/releases/$VERSION.md" "$RUNNER_TEMP/notes.md"
          else
            git log -1 --format=%B "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" "$APK" --clobber \
            || gh release create "$GITHUB_REF_NAME" "$APK" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"